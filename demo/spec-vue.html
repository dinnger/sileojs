<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../src/sileo.css">
<style>body{margin:0;background:#0b0b0c;color:#ededed;font-family:system-ui,sans-serif;padding:2rem}
#log{font:11px monospace;white-space:pre;margin-top:2rem}</style>
<script type="importmap">
{ "imports": { "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js" } }
</script>
</head><body>
<div id="global"></div>
<div id="comp"></div>
<div id="styles"></div>
<pre id="log"></pre>
<script type="module">
import { createApp, h } from "vue";
import { sileo } from "../src/sileo.js";
import { SileoPlugin, SileoToaster, useSileo, useSileoConfig } from "../src/vue.js";

const out = [];
const ok = (name, cond, extra = "") => out.push(`${cond ? "PASS" : "FAIL"}  ${name}${extra ? "  -> " + extra : ""}`);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* -------- A. sin componente: plugin + variable global $sileo -------------- */
createApp({
  template: `<button id="b-global" @click="$sileo.success({ title: 'Global', description: 'Desde $sileo.' })">Guardar</button>`,
}).use(SileoPlugin, { position: "top-right", theme: "system" }).mount("#global");

await sleep(200);
// El viewport no existe hasta el primer toast (se crea y se recoge solo).
ok("plugin: aun sin toasts no hay viewport", !document.querySelector("[data-sileo-viewport]"));
document.getElementById("b-global").click();
await sleep(300);
ok("plugin: $sileo lanza el toast",
   !!document.querySelector('[data-sileo-toast][data-state="success"]'),
   document.querySelector("[data-sileo-title]")?.textContent);
ok("plugin: aplica la position que le pasas",
   document.querySelector("[data-sileo-viewport]")?.dataset.position === "top-right",
   document.querySelector("[data-sileo-viewport]")?.dataset.position);

/* -------- B. con componente <SileoToaster> -------------------------------- */
const appB = createApp({
  components: { SileoToaster },
  setup() {
    const sileo = useSileo();
    return { lanzar: () => sileo.info({ id: "comp", title: "Componente", description: "Desde useSileo()." }) };
  },
  template: `<div><SileoToaster position="bottom-left" /><button id="b-comp" @click="lanzar">Ir</button></div>`,
});
appB.mount("#comp");
await sleep(200);
document.getElementById("b-comp").click();
await sleep(300);
ok("componente: useSileo() lanza el toast",
   !!document.querySelector('[data-sileo-toast][data-state="info"]'));

/* -------- C. desmontar limpia -------------------------------------------- */
appB.unmount();
await sleep(300);
// El componente no creo el toaster (lo hizo el plugin), asi que al desmontarse
// no debe llevarselo por delante.
ok("unmount: el toaster del plugin sobrevive", !!document.querySelector('[data-sileo-toast][data-state="success"]'));
document.getElementById("b-global").click();
await sleep(300);
ok("unmount: $sileo sigue funcionando",
   !!document.querySelector('[data-sileo-toast][data-state="success"]'));


/* -------- D. estilos por el plugin y config dinamica ---------------------- */
const appD = createApp({
  setup() {
    const cfg = useSileoConfig();
    return {
      cfg,
      lanzar: () => sileo.warning({ id: "sty", title: "Estilos", description: "Desde el plugin." }),
    };
  },
  template: `<button id="b-sty" @click="lanzar">Ir</button>`,
});
appD.use(SileoPlugin, {
  mount: false,
  position: "top-right",
  theme: "light",
  options: { roundness: 14, styles: { toast: "top-90", badge: "mi-badge" } },
});
const vmD = appD.mount("#styles");
await sleep(200);
document.getElementById("b-sty").click();
await sleep(400);

const nsty = () => document.querySelector('[data-sileo-toast][data-state="warning"]');
ok("plugin: options.styles pone la clase en el toast", !!nsty()?.classList.contains("top-90"),
   nsty()?.className);
ok("plugin: options.styles llega al badge", !!nsty()?.querySelector("[data-sileo-badge].mi-badge"));
ok("plugin: options.roundness se aplica",
   nsty()?.style.getPropertyValue("--sileo-roundness") === "14px",
   nsty()?.style.getPropertyValue("--sileo-roundness"));
ok("plugin: theme light en el viewport",
   nsty()?.closest("[data-sileo-viewport]")?.dataset.theme === "light",
   nsty()?.closest("[data-sileo-viewport]")?.dataset.theme);

// tema dinamico
vmD.cfg.theme = "dark";
await sleep(200);
ok("config reactiva: cambiar el tema en caliente",
   nsty()?.closest("[data-sileo-viewport]")?.dataset.theme === "dark",
   nsty()?.closest("[data-sileo-viewport]")?.dataset.theme);

// posicion dinamica
vmD.cfg.position = "bottom-center";
await sleep(300);
ok("config reactiva: cambiar la posicion en caliente",
   nsty()?.closest("[data-sileo-viewport]")?.dataset.position === "bottom-center",
   nsty()?.closest("[data-sileo-viewport]")?.dataset.position);

// estilos dinamicos
vmD.cfg.styles.toast = "otra-clase";
await sleep(200);
ok("config reactiva: cambiar styles en caliente",
   nsty()?.classList.contains("otra-clase") && !nsty()?.classList.contains("top-90"),
   nsty()?.className);
delete vmD.cfg.styles.toast;
await sleep(200);
ok("config reactiva: borrar un style lo quita del DOM",
   !nsty()?.classList.contains("otra-clase"), nsty()?.className);

document.getElementById("log").textContent = out.join("\n") +
  (out.some((l) => l.startsWith("FAIL")) ? "\n\nHAY FALLOS" : "\n\nTODO OK");
</script></body></html>
